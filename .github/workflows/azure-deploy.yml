name: Deploy to Azure App Service

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'web/**'
      - 'build-azure.ps1'
      - '.github/workflows/azure-deploy.yml'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（例如 v1.0.0）'
        required: false
        default: 'latest'
      create_release:
        description: '创建 GitHub Release 附带部署包（可手动下载上传）'
        type: boolean
        required: false
        default: false

env:
  AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
  AZURE_WEBAPP_NAME: ${{ vars.AZURE_WEBAPP_NAME }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: 设置 Go 环境
        uses: actions/setup-go@v6
        with:
          go-version-file: 'src/go.mod'
          cache-dependency-path: 'src/go.sum'

      - name: 设置 Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: web/package.json
          cache-dependency-path: web/package-lock.json

      - name: 构建前端
        run: |
          cd web
          npm ci
          npm run build

      - name: 确定版本号
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.version }}" != "latest" ]; then
            VERSION="${{ github.event.inputs.version }}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            VERSION="${{ github.ref_name }}"
          else
            VERSION="$(date -u +%Y%m%d)-${GITHUB_SHA::7}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "版本号: $VERSION"

      - name: 编译 Go 二进制 (linux/amd64)
        run: |
          cd src
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -ldflags="-s -w -X main.Version=${{ steps.version.outputs.version }}" \
            -trimpath -o hubproxy .

      - name: 组装 App Service 部署包
        run: |
          mkdir -p deploy
          cp src/hubproxy deploy/
          chmod +x deploy/hubproxy
          cp src/config.toml deploy/
          cp build/startup.sh deploy/

      - name: 打包部署文件
        run: cd deploy && zip -r ../deploy-package.zip .

      - name: 上传部署包 (Actions Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: hubproxy-appservice-${{ steps.version.outputs.version }}
          path: deploy-package.zip
          if-no-files-found: error
          retention-days: 30

      - name: 创建 GitHub Release（手动触发时可选）
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.create_release == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: appservice-deploy-${{ steps.version.outputs.version }}
          name: "HubProxy App Service 部署包 ${{ steps.version.outputs.version }}"
          body: |
            Linux App Service 部署包。

            部署步骤见 `docs/azure-functions.md`。
            手动部署：Azure Portal → App Service → 部署中心 → 上传 zip
          files: deploy-package.zip
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 部署到 Azure App Service
        uses: Azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: deploy-package.zip
